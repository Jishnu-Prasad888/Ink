name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and upload, e.g. 1.4.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Notes come from the triggering ref, so a re-run can use updated notes.
      - uses: actions/checkout@v5

      # Create the release up front so the build jobs only upload into it.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Ink $TAG" --notes-file .github/release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "Ink $TAG" --notes-file .github/release-notes.md
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build bundles
        run: npm run tauri build

      # Upload with the GitHub CLI: tauri-action's uploader has been exiting
      # silently partway through uploads, leaving releases without assets.
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          files=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage \
            "$bundle"/msi/*.msi "$bundle"/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No bundles found in $bundle"
            exit 1
          fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
