name: Release

on:
  push:
    tags:
      - "1.3.1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: Ink __VERSION__
          releaseBody: |
            # Ink 1.3.1

            Ink 1.3.1 refreshes the interface toward a clearer Apple-inspired design and makes everyday mode switching feel smoother on Linux and Windows.

            ## Interface

            - Refines the overall look toward a light, system-like visual language with clearer hierarchy and selection contrast.
            - Keeps application chrome text (toolbars, dialog headings, sidebar labels) non-selectable so UI chrome does not interfere with editing.
            - Leaves document content selectable in the editor, Markdown preview, form fields, and PDF text layers.
            - Starts with the Explorer sidebar closed by default for a calmer first viewport.
            - Extracts toolbar controls into a dedicated component for cleaner layout ownership.

            ## Editing experience

            - Animates transitions between Edit, Split, and Preview modes so panes slide and fade instead of hard-swapping.
            - Keeps both editor and preview mounted during mode changes to preserve scroll and editing continuity.

            ## Reliability

            - Resolves npm install peer-dependency issues affecting CI and local setups.
            - Fixes Prettier formatting and Editor scroll-restore lint failures so the release pipeline stays green.

            ## Upgrade notes

            - Existing documents, drafts, themes, shortcuts, and session data remain compatible.
            - Explorer now opens closed on launch; use the Explorer toggle or shortcut to show it.

            ## Verification

            - Frontend formatting, linting, automated tests, TypeScript compilation, and production bundling pass.
            - Rust formatting, tests, and clippy pass.

            Download the Linux or Windows installer/package below.
          releaseDraft: false
          prerelease: false
